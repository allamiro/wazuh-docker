# ----------------------------------------------------------------------------
# Canonical certificate inventory - THE single source of truth for every TLS
# identity in this deployment. generate-certs.sh (csr/sign/import/verify) and
# deploy-certs.sh (docker/export/vm) all parse this file; the tables in
# DEPLOYMENT-GUIDE.md are derived from it. Do not define identities anywhere
# else.
#
# Format (pipe-separated, one identity per line):
#   name|role|sans|required_ekus
#
#   name           file basename (name.pem / name-key.pem / csr/name.csr)
#                  and the certificate CN
#   role           indexer | admin-client | filebeat | wazuh-api | authd | dashboard
#   sans           comma-separated DNS SANs; @DOMAIN@ expands to $SIEM_DOMAIN
#                  (default: siem.local.domain)
#   required_ekus  comma-separated EKUs that MUST be present for verify to
#                  pass (extra EKUs are allowed; the bundled CA issues
#                  serverAuth+clientAuth on every leaf)
#
# Identity model (what is TLS and what is not):
#   - Every indexer node: one identity, used for BOTH cluster transport (9300,
#     mutual TLS -> needs serverAuth+clientAuth) and HTTPS REST (9200).
#     The full subject must be exactly "CN=<name>" - it is pinned in
#     plugins.security.nodes_dn in every opensearch.yml.
#   - admin: single client identity for securityadmin.sh
#     (plugins.security.authcz.admin_dn = CN=admin).
#   - wazuh.master / wazuh.worker*: Filebeat CLIENT identities toward the
#     indexers. NOTE: the Wazuh manager cluster on 1516 does NOT use X.509 -
#     it is secured by the shared 32-char cluster key from
#     generate-credentials.sh.
#   - wazuh.master-api: server certificate for the Wazuh API (55000). Without
#     it the API serves a self-signed auto-generated certificate.
#   - wazuh.master-enrollment: server certificate for agent enrollment
#     (authd, 1515) - installed as sslmanager.cert/key.
#   - wazuh.dashboard: HTTPS server certificate browsers see on 443.
#   - Agent event traffic (1514) uses the Wazuh agent protocol (pre-shared
#     AES keys), not X.509 - no certificate exists for it by design.
# ----------------------------------------------------------------------------

# --- indexer cluster (16 nodes) ---------------------------------------------
master1.indexer|indexer|master1.indexer,master1.@DOMAIN@|serverAuth,clientAuth
master2.indexer|indexer|master2.indexer,master2.@DOMAIN@|serverAuth,clientAuth
master3.indexer|indexer|master3.indexer,master3.@DOMAIN@|serverAuth,clientAuth
hot1.indexer|indexer|hot1.indexer,hot1.@DOMAIN@|serverAuth,clientAuth
hot2.indexer|indexer|hot2.indexer,hot2.@DOMAIN@|serverAuth,clientAuth
hot3.indexer|indexer|hot3.indexer,hot3.@DOMAIN@|serverAuth,clientAuth
warm1.indexer|indexer|warm1.indexer,warm1.@DOMAIN@|serverAuth,clientAuth
warm2.indexer|indexer|warm2.indexer,warm2.@DOMAIN@|serverAuth,clientAuth
warm3.indexer|indexer|warm3.indexer,warm3.@DOMAIN@|serverAuth,clientAuth
cold1.indexer|indexer|cold1.indexer,cold1.@DOMAIN@|serverAuth,clientAuth
cold2.indexer|indexer|cold2.indexer,cold2.@DOMAIN@|serverAuth,clientAuth
cold3.indexer|indexer|cold3.indexer,cold3.@DOMAIN@|serverAuth,clientAuth
ingest1.indexer|indexer|ingest1.indexer,ingest1.@DOMAIN@|serverAuth,clientAuth
ingest2.indexer|indexer|ingest2.indexer,ingest2.@DOMAIN@|serverAuth,clientAuth
coord1.indexer|indexer|coord1.indexer,indexer.@DOMAIN@|serverAuth,clientAuth
coord2.indexer|indexer|coord2.indexer,indexer.@DOMAIN@|serverAuth,clientAuth

# --- securityadmin client identity ------------------------------------------
admin|admin-client|admin|clientAuth

# --- Wazuh server cluster: Filebeat client identities ------------------------
wazuh.master|filebeat|wazuh.master,@DOMAIN@,manager.@DOMAIN@|clientAuth
wazuh.worker1|filebeat|wazuh.worker1|clientAuth
wazuh.worker2|filebeat|wazuh.worker2|clientAuth
wazuh.worker3|filebeat|wazuh.worker3|clientAuth
wazuh.worker4|filebeat|wazuh.worker4|clientAuth

# --- Wazuh master service identities ----------------------------------------
wazuh.master-api|wazuh-api|wazuh.master,@DOMAIN@,manager.@DOMAIN@|serverAuth
wazuh.master-enrollment|authd|wazuh.master,@DOMAIN@,manager.@DOMAIN@|serverAuth

# --- dashboard ---------------------------------------------------------------
wazuh.dashboard|dashboard|wazuh.dashboard,@DOMAIN@,dashboard.@DOMAIN@,localhost|serverAuth
