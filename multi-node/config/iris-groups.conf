# ----------------------------------------------------------------------------
# IRIS GROUP MAP - SOC roles inside DFIR-IRIS, declaratively.
#
# Applied with:   python3 scripts/iris-sync-users.py
# (idempotent - creates missing groups, updates permissions, maps Keycloak
#  groups to IRIS groups, and refreshes per-case access)
#
# Format:
#   keycloak_group|iris_group|permissions|case_access
#
#   keycloak_group  group in the realm (the token's "groups" claim)
#   iris_group      IRIS group name; created if missing
#   permissions     comma-separated IRIS permission names (see list below)
#   case_access     default access to every case: deny_all | read_only | full_access
#
# IRIS permission names (each is one bit; the UI shows the same list under
# Advanced > Access control > Groups):
#   standard_user            basic interface + create cases
#   server_administrator     manage users, groups, server settings
#   alerts_read              see the alerts queue
#   alerts_write             modify alerts / escalate to cases
#   alerts_delete            delete alerts
#   search_across_cases      search beyond the current case
#   customers_read           read customers
#   customers_write          add/edit customers
#   case_templates_read      read case templates
#   case_templates_write     add/edit case templates
#   activities_read          read activities of accessible cases
#   all_activities_read      read activities of ALL cases
#   statistics_read          dashboards/statistics
#   custom_dashboards_read   view custom dashboards
#   custom_dashboards_write  build custom dashboards
#   custom_dashboards_share  share custom dashboards
#
# Case access levels (IRIS resolves customer -> group -> user, user wins):
#   deny_all      the case is not even listed
#   read_only     visible, not editable
#   full_access   read/write, may close and delete
#
# PRODUCTION: reorganise here, re-run the script, done. Keep the principle
# that only engineers hold server_administrator, and that Tier 1 triages
# alerts without being able to rewrite case evidence.
# ----------------------------------------------------------------------------

