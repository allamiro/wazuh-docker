user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# Offline maps vhost: browsers and the dashboard fetch map tiles from
# https://siem.local.domain:8080, TLS-terminated here with the dashboard
# certificate (same hostname) and proxied to the maps-server container.
# The variable + resolver defer DNS so nginx starts fine when the optional
# "maps" profile is disabled (requests then return 502, matching the
# no-maps-server state).
http {
    # MISP (threat intel) - optional "soc" profile
    server {
        listen 8081 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/misp.pem;
        ssl_certificate_key /etc/nginx/certs/misp-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 50M;
        location / {
            resolver 127.0.0.11 valid=30s;
            set $misp http://misp:80;
            proxy_pass $misp;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    # DFIR-IRIS (case management) - optional "soc" profile
    server {
        listen 8082 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/iris.pem;
        ssl_certificate_key /etc/nginx/certs/iris-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 100M;
        location / {
            resolver 127.0.0.11 valid=30s;
            set $iris http://iris-sso:4180;   # OAuth2 proxy (Keycloak SSO)
            proxy_pass $iris;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 8080 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/maps.pem;
        ssl_certificate_key /etc/nginx/certs/maps-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            resolver 127.0.0.11 valid=30s;
            set $maps http://maps-server:8080;
            proxy_pass $maps;
            proxy_set_header Host $host;
        }
    }
}

# Single agent entry point: siem.local.domain
stream {
    # Agent event traffic - balanced across the Wazuh server cluster.
    upstream wazuh_events {
        hash $remote_addr consistent;
        server wazuh.master:1514;
        server wazuh.worker1:1514;
        server wazuh.worker2:1514;
        server wazuh.worker3:1514;
        server wazuh.worker4:1514;
    }
    server {
        listen 1514;
        proxy_pass wazuh_events;
    }

    # Agent enrollment - authd runs on the master only.
    server {
        listen 1515;
        proxy_pass wazuh.master:1515;
    }
}
