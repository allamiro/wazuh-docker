user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# Single agent entry point: siem.local.domain
stream {
    # Agent event traffic - balanced across the Wazuh server cluster.
    upstream wazuh_events {
        hash $remote_addr consistent;
        server wazuh.master:1514;
        server wazuh.worker1:1514;
        server wazuh.worker2:1514;
        server wazuh.worker3:1514;
        server wazuh.worker4:1514;
    }
    server {
        listen 1514;
        proxy_pass wazuh_events;
    }

    # Agent enrollment - authd runs on the master only.
    server {
        listen 1515;
        proxy_pass wazuh.master:1515;
    }
}
