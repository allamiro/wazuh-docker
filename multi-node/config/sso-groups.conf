# ----------------------------------------------------------------------------
# SSO GROUP MAP - the single source of truth for "who can do what".
#
# One line per Keycloak group. './wazuh-deploy.sh sso init' reads this file and
# applies ALL THREE permission layers for you:
#
#   1. indexer_roles  -> OpenSearch security roles  = what DATA you can see
#                        (indices, saved objects, dashboards)
#   2. api_roles      -> Wazuh API RBAC roles       = what MODULES can do
#                        (MITRE, agents, rules, SCA, active response...)
#   3. tenant         -> OpenSearch tenant          = which WORKSPACE you get
#                        (the OpenSearch equivalent of Kibana "spaces":
#                         a private area for dashboards/visualizations/saved
#                         searches, shared by everyone with access to it)
#
# Format:
#   group|indexer_roles|api_roles|tenant[:RW|:R][|data_scope]
#
#   group         Keycloak group name (arrives in the token's "groups" claim
#                 and becomes an OpenSearch *backend role*)
#   indexer_roles comma-separated OpenSearch security roles
#   api_roles     comma-separated Wazuh API role names
#   tenant        tenant name + access; use "global_tenant:RW" for the shared
#                 default workspace, "-" for no tenant access, or any new name
#                 (it is created automatically)
#   data_scope    OPTIONAL 5th column - document-level security: a Lucene
#                 query limiting which ALERTS this group can see at all, e.g.
#                 "agent.name:fin-*" or "agent.id:(001 OR 002)". This is what
#                 separates ORGANIZATIONS/tenants at the data level, not just
#                 the workspace. Omit or "-" for full visibility.
#                 IMPORTANT: DLS is additive across roles - a scoped group must
#                 NOT also hold readall/all_access, or it sees everything.
#
# ADDING A NEW TEAM (e.g. a compliance team that may only read PCI dashboards
# in its own workspace):
#   1. create the group in Keycloak (Groups -> New)
#   2. add one line here, e.g.
#        compliance|kibana_user,readall|readonly|compliance:RW
#   3. ./wazuh-deploy.sh sso init      (idempotent - safe to re-run)
#   4. affected users log out and back in (roles are minted into the token
#      at login on both layers)
#
# Useful building blocks:
#   indexer_roles : all_access, kibana_user, readall, readall_and_monitor,
#                   alerting_read_access, security_analytics_read_access
#                   (list them all: GET /_plugins/_security/api/roles)
#   api_roles     : administrator, readonly, users_admin, agents_readonly,
#                   agents_admin, cluster_readonly, cluster_admin
#                   (list them all: GET /security/roles on the Wazuh API)
# ----------------------------------------------------------------------------

siem-admins|all_access|administrator|global_tenant:RW
siem-analysts|kibana_user,readall|readonly,agents_readonly,cluster_readonly|soc:RW
siem-readonly|kibana_user,readall|readonly|soc:R

# Example of a fully separated organization/business unit: its own workspace,
# read-only modules, and DLS so it can ONLY query its own agents' alerts.
# Note: kibana_user only - no readall - so the scope actually restricts.
#finance-soc|kibana_user|readonly|finance:RW|agent.name:fin-*
