# ----------------------------------------------------------------------------
# SSO CLIENT REGISTRY - one line per service that authenticates via Keycloak.
#
# This is the file you edit when moving to production: change the domain and
# the ports, add or remove services, then run
#
#     ./wazuh-deploy.sh sso clients
#
# which creates/updates every client in the realm (idempotent) and stores a
# freshly generated secret for each one in .env as <NAME>_OIDC_SECRET.
#
# Format:
#   name|client_id|base_url|redirect_path|scopes|claims
#
#   name           short id; also the .env prefix (WAZUH -> WAZUH_OIDC_SECRET)
#   client_id      the OIDC client_id the service sends
#   base_url       public URL of the service (@DOMAIN@ expands to SIEM_DOMAIN)
#   redirect_path  callback path appended to base_url ("*" for a wildcard)
#   scopes         extra scopes to grant beyond openid/profile/email ("-" none)
#   claims         extra protocol mappers, comma separated:
#                    groups        group-membership claim (needed for RBAC)
#                    audience      aud=<client_id>   (IRIS validates this)
#                    sub-as-email  write the e-mail into sub (IRIS expects it)
#
# Every client is confidential (has a secret) and gets its own secret - never
# share one client between services: a leaked secret must only ever cost you
# one application.
# ----------------------------------------------------------------------------

WAZUH|wazuh-dashboard|https://@DOMAIN@|/auth/openid/login|-|groups
MISP|misp|https://misp.@DOMAIN@:8081|*|-|groups
IRIS|iris|https://iris.@DOMAIN@:8082|/oidc-authorize|-|groups,audience,sub-as-email

# Add further services the same way, e.g. a SOAR or a wiki:
#SHUFFLE|shuffle|https://soar.@DOMAIN@:8083|/oauth2/callback|-|groups
