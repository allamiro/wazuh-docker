      - ./config/wazuh_indexer_ssl_certs/wazuh.worker1-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_worker1.conf:/wazuh-config-mount/etc/ossec.conf
    depends_on:
