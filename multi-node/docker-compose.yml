      - S3_REGION=${ARCHIVE_S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - "OPENSEARCH_JAVA_OPTS=-Xms${IDX_COORD_HEAP_MIN:-${IDX_COORD_HEAP:-512m}} -Xmx${IDX_COORD_HEAP:-512m}"
      - "bootstrap.memory_lock=true"
    deploy:
      resources:
        limits:
          memory: ${IDX_COORD_MEM_LIMIT:-1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"   # admin access to the REST API - localhost only
    healthcheck:
      test: [ "CMD-SHELL", "curl -fks https://localhost:9200/_plugins/_security/health | grep -q '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      - ./scripts/indexer-init.sh:/usr/local/bin/indexer-init.sh:ro
      - ./config/archive:/archive:ro
      - indexer-data-coord1:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/coord1.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/coord1.indexer.key
      - ./config/wazuh_indexer_ssl_certs/coord1.indexer.pem:/usr/share/wazuh-indexer/config/certs/coord1.indexer.pem
      - ./config/wazuh_indexer/coord1.indexer.yml:/opensearch.node.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    networks:
      - siem
  coord2.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.7}
    entrypoint: [ "/usr/local/bin/indexer-init.sh" ]
    # root only for the init wrapper (plugin/truststore/keystore setup);
    # the stock entrypoint then drops to the wazuh-indexer user
    user: "0"
    hostname: coord2.indexer
    container_name: coord2.indexer
    restart: always
    cpu_shares: ${IDX_COORD_CPU_SHARES:-512}
    environment:
      # archive module (inert while ARCHIVE_S3_ENDPOINT is unset)
      - S3_ENDPOINT=${ARCHIVE_S3_ENDPOINT:-}
      - S3_REGION=${ARCHIVE_S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - "OPENSEARCH_JAVA_OPTS=-Xms${IDX_COORD_HEAP_MIN:-${IDX_COORD_HEAP:-512m}} -Xmx${IDX_COORD_HEAP:-512m}"
      - "bootstrap.memory_lock=true"
    deploy:
      resources:
        limits:
          memory: ${IDX_COORD_MEM_LIMIT:-1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD-SHELL", "curl -fks https://localhost:9200/_plugins/_security/health | grep -q '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      - ./scripts/indexer-init.sh:/usr/local/bin/indexer-init.sh:ro
      - ./config/archive:/archive:ro
      - indexer-data-coord2:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/coord2.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/coord2.indexer.key
      - ./config/wazuh_indexer_ssl_certs/coord2.indexer.pem:/usr/share/wazuh-indexer/config/certs/coord2.indexer.pem
      - ./config/wazuh_indexer/coord2.indexer.yml:/opensearch.node.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    networks:
      - siem
  # Optional dedicated machine-learning node (OpenSearch ml-commons).
  # Wazuh has no ML component of its own; this node runs the bundled
  # opensearch-ml plugin's workloads (anomaly detection models etc.)
  # without stealing resources from the data tiers.
  ml1.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.7}
    entrypoint: [ "/usr/local/bin/indexer-init.sh" ]
    # root only for the init wrapper (plugin/truststore/keystore setup);
    # the stock entrypoint then drops to the wazuh-indexer user
    user: "0"
    profiles: [ "ml" ]
    hostname: ml1.indexer
    container_name: ml1.indexer
    restart: always
    cpu_shares: ${IDX_ML_CPU_SHARES:-1024}
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms${IDX_ML_HEAP_MIN:-${IDX_ML_HEAP:-1g}} -Xmx${IDX_ML_HEAP:-1g}"
      - "bootstrap.memory_lock=true"
      # archive module (inert while ARCHIVE_S3_ENDPOINT is unset)
      - S3_ENDPOINT=${ARCHIVE_S3_ENDPOINT:-}
      - S3_REGION=${ARCHIVE_S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
    deploy:
      resources:
        limits:
          memory: ${IDX_ML_MEM_LIMIT:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD-SHELL", "curl -fks https://localhost:9200/_plugins/_security/health | grep -q '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      - ./scripts/indexer-init.sh:/usr/local/bin/indexer-init.sh:ro
      - ./config/archive:/archive:ro
      - indexer-data-ml1:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/ml1.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/ml1.indexer.key
      - ./config/wazuh_indexer_ssl_certs/ml1.indexer.pem:/usr/share/wazuh-indexer/config/certs/ml1.indexer.pem
      - ./config/wazuh_indexer/ml1.indexer.yml:/opensearch.node.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    depends_on:
      master1.indexer:
        condition: service_started
    networks:
      - siem

  # ---------------------------------------------------------------------------
  # Optional archive module (enable with: ./wazuh-deploy.sh archive enable)
  # RustFS = S3-compatible object storage for long retention:
  #   wazuh-index-snapshots  <- OpenSearch snapshots (restore on demand)
  #   wazuh-raw-archives     <- raw events (archives.json)
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.0-rc.1}
    profiles: [ "archive" ]
    hostname: rustfs
    container_name: rustfs
    restart: always
    deploy:
      resources:
        limits:
          memory: ${RUSTFS_MEM_LIMIT:-1g}
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-}
      - RUSTFS_TLS_PATH=/tls
    volumes:
      - rustfs-data:/data
      - ./config/wazuh_indexer_ssl_certs/rustfs-tls:/tls:ro
    networks:
      - siem

  # Ships the Wazuh master's raw event archives (archives.json rotations, only
  # written when <logall_json> is enabled) into wazuh-raw-archives hourly.
  archiver:
    image: rclone/rclone:${RCLONE_VERSION:-1.68}
    profiles: [ "archive" ]
    hostname: archiver
    container_name: siem-archiver
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      - RCLONE_CONFIG_ARCHIVE_TYPE=s3
      - RCLONE_CONFIG_ARCHIVE_PROVIDER=Other
      - RCLONE_CONFIG_ARCHIVE_ENDPOINT=${ARCHIVE_S3_ENDPOINT:-https://rustfs:9000}
      - RCLONE_CONFIG_ARCHIVE_ACCESS_KEY_ID=${S3_ACCESS_KEY:-}
      - RCLONE_CONFIG_ARCHIVE_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-}
      - RCLONE_CONFIG_ARCHIVE_FORCE_PATH_STYLE=true
      - RCLONE_CA_CERT=/certs/root-ca.pem
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        while true; do
          rclone sync /logs/archives archive:wazuh-raw-archives/wazuh.master --log-level NOTICE
          sleep 3600
        done
    volumes:
      - master-wazuh-logs:/logs:ro
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/certs/root-ca.pem:ro
    depends_on:
      - rustfs
    networks:
      - siem

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.7}
    hostname: wazuh.dashboard
    container_name: wazuh.dashboard
    restart: always
    ports:
      - "443:5601"   # https://siem.local.domain
    deploy:
      resources:
        limits:
          memory: ${DASHBOARD_MEM_LIMIT:-1536m}
    environment:
      - OPENSEARCH_HOSTS="https://coord1.indexer:9200"
      - WAZUH_API_URL="https://wazuh.master"
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:?run ./generate-credentials.sh first}
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?run ./generate-credentials.sh first}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      coord1.indexer:
        condition: service_healthy
      wazuh.master:
        condition: service_started
    networks:
      - siem

  # TCP load balancer: single entry point (siem.local.domain) for agent
  # traffic - events (1514) are balanced across the Wazuh server cluster,
  # enrollment (1515) always goes to the master.
  nginx:
    image: nginx:${NGINX_VERSION:-1.29-alpine}
    hostname: nginx
    container_name: siem-nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "1514:1514"
      - "1515:1515"
    depends_on:
      - wazuh.master
      - wazuh.worker1
      - wazuh.worker2
      - wazuh.worker3
      - wazuh.worker4
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - siem

networks:
  siem:
    name: siem
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24
          # dynamic allocations stay in the upper half; static manager IPs
          # (.11-.15) live below it and can never collide
          ip_range: 10.77.0.128/25

