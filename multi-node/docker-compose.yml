# Wazuh multi-node stack for air-gapped deployment - enterprise topology
# Host: single 32 GB RAM server. See DEPLOYMENT-GUIDE.md for the memory budget.
#
# Indexer cluster (16 nodes):
#   master1-3.indexer   dedicated cluster managers (quorum of 3)
#   hot1-3.indexer      hot-tier data nodes   (node.attr.temp=hot)
#   warm1-3.indexer     warm-tier data nodes  (node.attr.temp=warm)
#   cold1-3.indexer     cold-tier data nodes  (node.attr.temp=cold)
#   ingest1-2.indexer   dedicated ingest nodes (Filebeat writes here)
#   coord1-2.indexer    dedicated coordinating nodes (dashboard queries here)
# Wazuh server cluster: wazuh.master + wazuh.worker1-4
#   (the Wazuh cluster protocol allows exactly ONE master node)
#
# Before first start you MUST run:
#   ./generate-certs.sh          (TLS certificates signed by the external CA)
#   ./generate-credentials.sh    (passwords, bcrypt hashes, cluster key)
#
# Wazuh App Copyright (C) 2017, Wazuh Inc. (License GPLv2)
services:
  wazuh.master:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.7}
    hostname: wazuh.master
    container_name: wazuh.master
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    deploy:
      resources:
        limits:
          memory: ${MANAGER_MEM_LIMIT:-1536m}
    ports:
      - "127.0.0.1:55000:55000"   # Wazuh API - localhost only, dashboard reaches it internally
    environment:
      - INDEXER_URL="https://ingest1.indexer:9200","https://ingest2.indexer:9200"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?run ./generate-credentials.sh first}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:?run ./generate-credentials.sh first}
    volumes:
      - master-wazuh-api-configuration:/var/ossec/api/configuration
      - master-wazuh-etc:/var/ossec/etc
      - master-wazuh-logs:/var/ossec/logs
      - master-wazuh-queue:/var/ossec/queue
      - master-wazuh-var-multigroups:/var/ossec/var/multigroups
      - master-wazuh-integrations:/var/ossec/integrations
      - master-wazuh-active-response:/var/ossec/active-response/bin
      - master-wazuh-agentless:/var/ossec/agentless
      - master-wazuh-wodles:/var/ossec/wodles
      - master-filebeat-etc:/etc/filebeat
      - master-filebeat-var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.master.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.master-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./config/wazuh_cluster/authd.pass:/wazuh-config-mount/etc/authd.pass
      # dedicated CA-signed cert for agent enrollment (authd, port 1515)
      - ./config/wazuh_indexer_ssl_certs/wazuh.master-enrollment.pem:/wazuh-config-mount/etc/sslmanager.cert
      - ./config/wazuh_indexer_ssl_certs/wazuh.master-enrollment-key.pem:/wazuh-config-mount/etc/sslmanager.key
      # dedicated CA-signed cert for the Wazuh API (port 55000) - replaces the
      # self-signed certificate the API generates on first start
      - ./config/wazuh_indexer_ssl_certs/wazuh.master-api.pem:/wazuh-config-mount/api/configuration/ssl/server.crt
      - ./config/wazuh_indexer_ssl_certs/wazuh.master-api-key.pem:/wazuh-config-mount/api/configuration/ssl/server.key
    depends_on:
      ingest1.indexer:
        condition: service_healthy
    networks:
      siem:
        # static IP: nginx stream upstreams resolve DNS only at startup;
        # a stable address survives container recreation
        ipv4_address: 10.77.0.11
