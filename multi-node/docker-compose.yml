  # TCP load balancer: single entry point (siem.local.domain) for agent
  # traffic - events (1514) are balanced across the Wazuh server cluster,
  # enrollment (1515) always goes to the master.
  nginx:
    image: nginx:${NGINX_VERSION:-1.29-alpine}
    hostname: nginx
    container_name: siem-nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "1514:1514"
      - "1515:1515"
    depends_on:
      - wazuh.master
      - wazuh.worker1
      - wazuh.worker2
      - wazuh.worker3
      - wazuh.worker4
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - siem

