  # ---------------------------------------------------------------------------
  # Indexer cluster
  # ---------------------------------------------------------------------------
  master1.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.7}
    entrypoint: [ "/usr/local/bin/indexer-init.sh" ]
    # root only for the init wrapper (plugin/truststore/keystore setup);
    # the stock entrypoint then drops to the wazuh-indexer user
    user: "0"
    hostname: master1.indexer
    container_name: master1.indexer
    restart: always
    cpu_shares: ${IDX_MASTER_CPU_SHARES:-512}
    environment:
      # archive module (inert while ARCHIVE_S3_ENDPOINT is unset)
      - S3_ENDPOINT=${ARCHIVE_S3_ENDPOINT:-}
      - S3_REGION=${ARCHIVE_S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - "OPENSEARCH_JAVA_OPTS=-Xms${IDX_MASTER_HEAP_MIN:-${IDX_MASTER_HEAP:-512m}} -Xmx${IDX_MASTER_HEAP:-512m}"
      - "bootstrap.memory_lock=true"
    deploy:
      resources:
        limits:
          memory: ${IDX_MASTER_MEM_LIMIT:-1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD-SHELL", "curl -fks https://localhost:9200/_plugins/_security/health | grep -q '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    volumes:
      - ./scripts/indexer-init.sh:/usr/local/bin/indexer-init.sh:ro
      - ./config/archive:/archive:ro
      - indexer-data-master1:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/master1.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/master1.indexer.key
      - ./config/wazuh_indexer_ssl_certs/master1.indexer.pem:/usr/share/wazuh-indexer/config/certs/master1.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/master1.indexer.yml:/opensearch.node.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    networks:
      - siem
